name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to shinyapps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'   # currently 4.5.x, matches shinyapps.io platform

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::shinydashboard
            any::rsconnect

      - name: Deploy to shinyapps.io
        env:
          SHINY_TOKEN:  ${{ secrets.SHINYTOKEN }}
          SHINY_SECRET: ${{ secrets.SHINYSECRET }}
        run: |
          Rscript -e "rsconnect::setAccountInfo(name='pingliao', token=Sys.getenv('SHINY_TOKEN'), secret=Sys.getenv('SHINY_SECRET'))"
          Rscript -e "rsconnect::deployApp(appName='Quantify_Your_Degree', forceUpdate=TRUE)"