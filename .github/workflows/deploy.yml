name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to shinyapps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: false

      # Force CRAN as the default repo for every R session.
      # rsconnect captures this when building manifest.json, and shinyapps.io
      # needs an absolute https URL it can resolve.
      - name: Pin CRAN repo via .Rprofile
        run: |
          echo 'options(repos = c(CRAN = "https://cloud.r-project.org"))' > "$HOME/.Rprofile"
          Rscript -e 'print(getOption("repos"))'

      # System libs needed when packages compile from source. The list covers
      # everything in the shiny + shinydashboard + rsconnect dependency tree
      # that needs a -dev header (fs needs libuv, openssl needs libssl, etc.).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libuv1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff5-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("rsconnect", "shiny", "shinydashboard"))'
          Rscript -e 'cat("Installed:\n"); print(installed.packages()[c("shiny","shinydashboard","rsconnect"), c("Version","Built")])'

      # Generate manifest separately so we can see exactly what's being shipped.
      - name: Generate and inspect manifest.json
        run: |
          Rscript -e 'rsconnect::writeManifest()'
          echo "----- manifest.json (first 150 lines) -----"
          head -150 manifest.json || true
          echo "----- end -----"

      - name: Deploy to shinyapps.io
        env:
          SHINY_TOKEN:  ${{ secrets.SHINYTOKEN }}
          SHINY_SECRET: ${{ secrets.SHINYSECRET }}
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name   = "pingliao",
              token  = Sys.getenv("SHINY_TOKEN"),
              secret = Sys.getenv("SHINY_SECRET")
            );
            rsconnect::deployApp(
              appName     = "Quantify_Your_Degree",
              forceUpdate = TRUE
            )
          '