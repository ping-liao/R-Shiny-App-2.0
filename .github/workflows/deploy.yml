name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to shinyapps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: false

      # Force CRAN as the default repo for *every* subsequent R session
      # (Rscript reads ~/.Rprofile automatically). This is what rsconnect
      # captures into manifest.json, so it has to be a real https URL.
      - name: Pin CRAN repo via .Rprofile
        run: |
          echo 'options(repos = c(CRAN = "https://cloud.r-project.org"))' > "$HOME/.Rprofile"
          echo "Confirming repos:"
          Rscript -e 'print(getOption("repos"))'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("rsconnect", "shiny", "shinydashboard"))'
          Rscript -e 'cat("Installed:\n"); print(installed.packages()[c("shiny","shinydashboard","rsconnect"), c("Version","LibPath")])'

      # Generate the manifest separately so we can see exactly what's
      # being sent. If this step's output shows shiny/shinydashboard
      # with proper https://cloud.r-project.org URLs, we're good.
      - name: Generate and inspect manifest.json
        run: |
          Rscript -e 'rsconnect::writeManifest()'
          echo "----- manifest.json (first 120 lines) -----"
          head -120 manifest.json || true
          echo "----- end -----"

      - name: Deploy to shinyapps.io
        env:
          SHINY_TOKEN:  ${{ secrets.SHINYTOKEN }}
          SHINY_SECRET: ${{ secrets.SHINYSECRET }}
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name   = "pingliao",
              token  = Sys.getenv("SHINY_TOKEN"),
              secret = Sys.getenv("SHINY_SECRET")
            );
            rsconnect::deployApp(
              appName     = "Quantify_Your_Degree",
              forceUpdate = TRUE
            )
          '