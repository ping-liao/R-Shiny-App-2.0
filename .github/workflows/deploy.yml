name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to shinyapps
    runs-on: ubuntu-latest

    env:
      # A real https CRAN mirror -- avoids the RSPM URL scheme that
      # shinyapps.io's builder can't resolve.
      CRAN_REPO: https://cloud.r-project.org

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'      # tracks shinyapps.io's runtime (4.5.x)
          use-public-rspm: false    # do NOT swap CRAN for RSPM

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(
            c("rsconnect", "shiny", "shinydashboard"),
            repos = Sys.getenv("CRAN_REPO")
          )'

      - name: Deploy to shinyapps.io
        env:
          SHINY_TOKEN:  ${{ secrets.SHINYTOKEN }}
          SHINY_SECRET: ${{ secrets.SHINYSECRET }}
        run: |
          Rscript -e '
            options(repos = c(CRAN = Sys.getenv("CRAN_REPO")));
            rsconnect::setAccountInfo(
              name   = "pingliao",
              token  = Sys.getenv("SHINY_TOKEN"),
              secret = Sys.getenv("SHINY_SECRET")
            );
            rsconnect::deployApp(
              appName     = "Quantify_Your_Degree",
              forceUpdate = TRUE
            )
          '